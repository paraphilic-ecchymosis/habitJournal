# ==================================
# Application Configuration
# ==================================

# Application Name
spring.application.name=Habit Journal

# Banner
spring.main.banner-mode=OFF

# ==================================
# MongoDB Configuration
# ==================================
# Use environment variables for credentials
# Set these in your environment or IDE run configuration:
# MONGODB_URI, MONGODB_DATABASE

spring.data.mongodb.database=${MONGODB_DATABASE:habitjournal}
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://hjadmin:MzG4RSiC7i59l3KV@mongo01.gp3eu.gcp.mongodb.net/habitjournal?retryWrites=true&w=majority}

# ==================================
# JWT Configuration
# ==================================
# JWT secret key (base64 encoded) - should be set as environment variable in production
# Generate new key with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# JWT token expiration in milliseconds (24 hours = 86400000)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================================
# Security Configuration
# ==================================
# Spring Security Debug (set to false in production)
spring.security.debug=false

# ==================================
# Logging Configuration
# ==================================
logging.level.root=INFO
logging.level.com.crookedcoder.habitjournal=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================================
# Thymeleaf Configuration
# ==================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==================================
# Server Configuration
# ==================================
server.port=${PORT:8080}

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

